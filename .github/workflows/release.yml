# Produces GitHub Releases, a maintained CHANGELOG.md, and an installable Python
# wheel from Conventional Commits. PyPI publishing is deliberately not wired:
# GitHub Release assets are Forseti's canonical distribution channel.
#
# Releases are cut on a weekly batch schedule (Sundays 00:00 UTC) rather than on
# every push, so semantic-release derives the next version from whatever
# Conventional Commit types accumulated on main that week. No-op if nothing
# releasable landed. Use workflow_dispatch to cut a release on demand.
name: Release

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install wheel build tools
        run: python -m pip install --upgrade "build>=1.4.3" "setuptools>=84.0.0"
      - uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
