name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this job only reads the checkout. The one thing it sends out
# is the coverage report, which authenticates with CODECOV_TOKEN rather than the
# workflow token — so no write scope is needed here.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push sequence doesn't queue
# redundant re-verifies (each otherwise re-runs unless the ESBMC cache hits).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned ESBMC release (matches the documented corpus k bounds; the upstream
  # v8.3 release is ESBMC 8.3.0, byte-identical to the dev fork on the corpus).
  ESBMC_VERSION: "8.3"
  # SHA-256 of the release asset below. Part of the cache key, so a version or
  # asset rotation forces a fresh download + verify. Bump in lockstep.
  ESBMC_SHA256: "982097d9987c40cd66bfcf1c7cb12a27cab89903571fe815a566e403345f04ab"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache ESBMC
        id: cache-esbmc
        uses: actions/cache@v6
        with:
          path: ~/esbmc
          key: esbmc-${{ env.ESBMC_VERSION }}-${{ env.ESBMC_SHA256 }}-ubuntu-24.04

      - name: Install ESBMC
        if: steps.cache-esbmc.outputs.cache-hit != 'true'
        env:
          ESBMC_ZIP: release-ubuntu-24.04--b.RelWithDebInfo.-e.OFF.zip
        run: |
          ESBMC_URL="https://github.com/esbmc/esbmc/releases/download/v$ESBMC_VERSION/$ESBMC_ZIP"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "/tmp/$ESBMC_ZIP" "$ESBMC_URL"

          echo "$ESBMC_SHA256  /tmp/$ESBMC_ZIP" | sha256sum --check --strict -

          unzip -q "/tmp/$ESBMC_ZIP" -d ~/esbmc
          rm "/tmp/$ESBMC_ZIP"

      - name: Add ESBMC to PATH
        run: echo "$HOME/esbmc/bin" >> "$GITHUB_PATH"

      - name: Sanity-check ESBMC is on PATH
        # Fail loudly if esbmc does not resolve: otherwise the esbmc-gated corpus
        # and integration tests would silently skip and the gate would be a no-op.
        run: esbmc --version

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint + format (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type-check (mypy --strict)
        run: mypy src tests

      - name: Tests (pytest)
        # 96, not 95, and the two numbers measure the same report: pytest-cov's
        # branch formula credits a partially-taken branch, Codecov's
        # hits/(hits+misses+partials) does not, so pytest-cov reads ~0.8pp high
        # (96.49 here vs Codecov's 95.68). Gating at 95 both sides would leave a
        # band — pytest-cov 95.3, Codecov 94.5 — where CI is green and
        # codecov/project is red. 96 keeps this fast in-job check the stricter
        # of the two, so it always trips first. The 95% bar itself lives in
        # codecov.yml; move them together.
        run: pytest -q --cov=forseti --cov-report=term-missing --cov-report=xml --cov-fail-under=96

      - name: Upload coverage to Codecov
        # Upload whenever a report exists, including when the step above failed
        # the job on coverage — that is exactly when it is most worth seeing.
        # `!cancelled()` alone is too broad: it is also true when an *earlier*
        # step fails (ruff, mypy, pip install, the ESBMC SHA check), which skips
        # pytest via its implicit success() and leaves no coverage.xml. The
        # action would then hard-fail on "no reports found" under
        # fail_ci_if_error, adding a red herring next to the real failure.
        # hashFiles is the precondition itself, so it also covers pytest dying
        # before it writes the XML (e.g. a collection error).
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pmatos/forseti
          files: ./coverage.xml
          fail_ci_if_error: true
