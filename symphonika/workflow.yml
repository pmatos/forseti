workflow:
  name: forseti_issue_to_pr
  initial: shipit.agent
  states:
    # Former builtin:single-agent-pr instance "shipit". Its own transitions
    # only prove provider_success + branch_ahead_of_base, not that the PR was
    # opened, so success routes through wait_for_pr_open rather than straight
    # to code_review_fix (vow-lang/vow#1277, symphonika #730).
    shipit.agent:
      action:
        kind: agent
        provider: claude
        prompt: prompts/impl.md
      transitions:
        - to: wait_for_pr_open
          when:
            provider_success: true
            branch_ahead_of_base: true
        - to: failed

    # pr_signal predicates (pr_open/pr_merged/...) are only projected for
    # kind: wait states, so this check cannot live on shipit's own template
    # transitions. This dedicated wait state is the supported way to gate on
    # PR existence: it reuses the same tracked-PR polling and
    # no-PR-ever-tracked escalation to sym:blocked/sym:human-needed that
    # wait_for_pr already relies on, but fails fast right after shipit
    # instead of silently burning a code_review_fix and a simplify run
    # against a branch with no PR first.
    wait_for_pr_open:
      action:
        kind: wait
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: code_review_fix
          when:
            pr_open: true
        - to: failed
          when:
            pr_open: false

    code_review_fix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/code-review-fix.md
      transitions:
        - to: simplify
          when:
            provider_success: true
        - to: failed

    simplify:
      action:
        kind: agent
        provider: claude
        prompt: prompts/simplify.md
      transitions:
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    wait_for_pr:
      action:
        kind: wait
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: merge
          when:
            checks: success
            mergeable: true
            unresolved_review_threads: 0
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure
        # Reviewer feedback on an otherwise-green PR. Ordered last so a clean
        # PR still merges and a broken one still repairs first. Without this
        # the state parks forever on the common shape -- green checks, one
        # unresolved thread -- because `merge` needs
        # unresolved_review_threads: 0 and `autofix` needs failing checks.
        # The orchestrator-wide review_followup loop no longer dispatches
        # alongside a parked raw-FSM run (issue #616), so a case this state
        # does not name is a case nothing handles.
        - to: autofix
          when:
            has_unresolved_reviews: true

    autofix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/autofix-pr.md
      transitions:
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    resolve_conflicts:
      action:
        kind: agent
        provider: claude
        prompt: prompts/resolve-conflicts.md
      transitions:
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    merge:
      action:
        kind: merge_pr
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure

    merged:
      terminal: success

    failed:
      terminal: blocked
