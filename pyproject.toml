[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forseti"
version = "0.0.0"
description = "ESBMC-in-the-loop: write -> verify -> counterexample -> fix"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The MCP server (forseti.core.mcp_server) needs the MCP SDK; kept optional so
# the base install and the loop/esbmc path stay dependency-free. Pinned to a
# FastMCP-supporting range: mcp==1.0.0 predates mcp.server.fastmcp, so a loose
# >=1.0 could install an SDK where `from mcp.server.fastmcp import FastMCP` fails.
mcp = ["mcp>=1.28.1,<2"]
# dev pulls in the mcp extra so CI type-checks and tests the server too.
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.161.6",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "forseti[mcp]",
]

[project.scripts]
forseti = "forseti.core.cli:main"
forseti-esbmc = "forseti.esbmc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes; I: import sorting; B: bugbear; UP: pyupgrade;
# SIM: simplify; RUF: ruff-native. `from __future__ import annotations` is used
# throughout, so UP/I are near no-ops.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.coverage.run]
source = ["forseti"]
branch = true
# `python -m forseti.core` shims: a docstring, an import, and a __main__ guard
# that by construction only runs out-of-process. Nothing to assert, and their
# permanent 0% would otherwise eat ~0.3pp of the 95% gate.
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
# Load-bearing, not cosmetic: coverage.py's fail-under test is
# `round(total, precision) < fail_under`, and precision defaults to 0. At the
# default, 95.5-95.99% rounds to 96 and passes `--cov-fail-under=96` — pytest-cov
# even prints "FAIL ... Total coverage: 95.65%" and still exits 0. 2 makes the
# gate mean what it says, and matches codecov.yml's own precision.
precision = 2
